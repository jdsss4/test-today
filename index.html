<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>13주차 과제 현황판</title>
  <!-- Google Fonts: Outfit & Noto Sans KR -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-dark: #090d16;
      --bg-card: rgba(22, 28, 45, 0.45);
      --card-border: rgba(255, 255, 255, 0.08);
      --card-border-hover: rgba(99, 102, 241, 0.3);
      --primary: #6366f1;
      --primary-gradient: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
      --emerald-gradient: linear-gradient(135deg, #10b981 0%, #059669 100%);
      --rose-gradient: linear-gradient(135deg, #f43f5e 0%, #e11d48 100%);
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --text-muted: #64748b;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Outfit', 'Noto Sans KR', sans-serif;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at 50% 0%, #1e1b4b 0%, var(--bg-dark) 70%);
      color: var(--text-main);
      overflow-x: hidden;
      padding-bottom: 80px;
    }

    /* Ambient Glow Effects */
    .glow-circle-1 {
      position: absolute;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.08) 0%, rgba(0, 0, 0, 0) 70%);
      top: -200px;
      left: 10%;
      z-index: 0;
      pointer-events: none;
    }

    .glow-circle-2 {
      position: absolute;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(236, 72, 153, 0.05) 0%, rgba(0, 0, 0, 0) 70%);
      top: 400px;
      right: 5%;
      z-index: 0;
      pointer-events: none;
    }

    .app-container {
      position: relative;
      z-index: 1;
      max-width: 1400px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    /* Header Section */
    .header {
      text-align: center;
      margin-bottom: 50px;
      animation: fadeInDown 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .badge {
      display: inline-block;
      padding: 8px 16px;
      background: rgba(99, 102, 241, 0.15);
      border: 1px solid rgba(99, 102, 241, 0.3);
      border-radius: 50px;
      font-size: 0.85rem;
      font-weight: 600;
      color: #818cf8;
      margin-bottom: 16px;
      letter-spacing: 0.5px;
    }

    .title {
      font-size: 3rem;
      font-weight: 800;
      letter-spacing: -1px;
      margin-bottom: 12px;
      background: linear-gradient(135deg, #ffffff 40%, #c7d2fe 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      font-size: 1.1rem;
      color: var(--text-sub);
      max-width: 600px;
      margin: 0 auto 30px auto;
      line-height: 1.6;
    }

    /* Stats Overview Dashboard */
    .stats-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin-bottom: 50px;
      animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.1s forwards;
      opacity: 0;
    }

    .stat-card {
      background: var(--bg-card);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 24px;
      text-align: center;
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .stat-card:hover {
      border-color: rgba(99, 102, 241, 0.25);
      transform: translateY(-3px);
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.2);
    }

    .stat-card.active {
      background: rgba(99, 102, 241, 0.08);
      border-color: var(--primary);
      box-shadow: 0 0 20px rgba(99, 102, 241, 0.15);
    }

    .stat-value {
      font-size: 2.2rem;
      font-weight: 800;
      margin-bottom: 4px;
    }

    .stat-card:nth-child(1) .stat-value { color: #f8fafc; }
    .stat-card:nth-child(2) .stat-value { color: #10b981; }
    .stat-card:nth-child(3) .stat-value { color: #f43f5e; }
    .stat-card:nth-child(4) .stat-value { color: #60a5fa; }

    .stat-label {
      font-size: 0.9rem;
      color: var(--text-sub);
      font-weight: 500;
    }

    /* Filter & Search Bar */
    .controls-wrapper {
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(10px);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 20px 30px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 40px;
      animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.2s forwards;
      opacity: 0;
    }

    .search-box {
      position: relative;
      flex: 1;
      min-width: 280px;
      max-width: 450px;
    }

    .search-box svg {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      width: 20px;
      height: 20px;
      fill: var(--text-muted);
      transition: fill 0.3s ease;
    }

    .search-input {
      width: 100%;
      padding: 14px 16px 14px 48px;
      background: rgba(30, 41, 59, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
      transition: all 0.3s ease;
    }

    .search-input:focus {
      border-color: var(--primary);
      background: rgba(30, 41, 59, 0.8);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
    }

    .search-input:focus + svg {
      fill: var(--primary);
    }

    .filters-group {
      display: flex;
      gap: 10px;
    }

    .filter-btn {
      background: rgba(30, 41, 59, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.05);
      color: var(--text-sub);
      padding: 10px 20px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .filter-btn:hover {
      background: rgba(30, 41, 59, 0.8);
      color: #fff;
    }

    .filter-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
    }

    .sort-select {
      background: rgba(30, 41, 59, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: var(--text-sub);
      padding: 10px 16px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 0.9rem;
      outline: none;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .sort-select:focus {
      border-color: var(--primary);
    }

    /* Cards Grid */
    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 25px;
      animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.3s forwards;
      opacity: 0;
    }

    /* Card Item */
    .card {
      background: var(--bg-card);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .card:hover {
      transform: translateY(-5px);
      border-color: var(--card-border-hover);
      box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.4), 0 0 25px rgba(99, 102, 241, 0.05);
    }

    /* Gradient highlight on cards that have submitted */
    .card.submitted-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 4px;
      background: var(--emerald-gradient);
    }

    .card.not-submitted-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 4px;
      background: var(--rose-gradient);
    }

    /* Card Top (Department and Student ID) */
    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .dept-badge {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-sub);
      background: rgba(255, 255, 255, 0.05);
      padding: 4px 10px;
      border-radius: 6px;
    }

    .student-id {
      font-size: 0.8rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    /* Card Profile */
    .profile-section {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 20px;
    }

    .avatar {
      width: 50px;
      height: 50px;
      border-radius: 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: 700;
      font-size: 1.3rem;
      color: #fff;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
    }

    .profile-info {
      flex: 1;
    }

    .student-name {
      font-size: 1.25rem;
      font-weight: 700;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .grade-badge {
      font-size: 0.75rem;
      font-weight: 600;
      background: rgba(99, 102, 241, 0.15);
      color: #a5b4fc;
      padding: 2px 6px;
      border-radius: 4px;
    }

    .student-email {
      font-size: 0.82rem;
      color: var(--text-sub);
      margin-top: 2px;
      word-break: break-all;
    }

    /* Progress stats */
    .progress-section {
      margin-bottom: 22px;
    }

    .progress-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      margin-bottom: 6px;
    }

    .progress-label {
      color: var(--text-sub);
    }

    .progress-value {
      font-weight: 600;
      color: #fff;
    }

    .progress-bar-bg {
      height: 6px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      border-radius: 10px;
      background: var(--primary-gradient);
      transition: width 0.8s ease-out;
    }

    /* Submission Status Display */
    .status-section {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.04);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .status-label {
      font-size: 0.82rem;
      color: var(--text-sub);
    }

    .status-badge {
      font-size: 0.8rem;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-badge.submitted {
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.3);
      box-shadow: 0 4px 10px rgba(16, 185, 129, 0.1);
    }

    .status-badge.not-submitted {
      background: rgba(244, 63, 94, 0.1);
      color: #fb7185;
      border: 1px solid rgba(244, 63, 94, 0.2);
    }

    /* Actions Section */
    .card-actions {
      display: flex;
      gap: 10px;
      margin-top: auto;
    }

    .btn-action {
      padding: 12px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(255, 255, 255, 0.04);
      color: var(--text-sub);
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: all 0.2s ease;
      text-decoration: none;
    }

    .btn-action:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      border-color: rgba(255, 255, 255, 0.15);
    }

    .btn-action svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    .btn-primary {
      flex: 1;
      background: var(--primary-gradient);
      border: none;
      color: #fff;
      font-weight: 600;
      font-size: 0.9rem;
      gap: 8px;
    }

    .btn-primary:hover {
      background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
      box-shadow: 0 6px 15px rgba(99, 102, 241, 0.3);
      transform: translateY(-1px);
    }

    .btn-primary:active {
      transform: translateY(0);
    }

    .btn-primary.disabled {
      background: rgba(255, 255, 255, 0.05) !important;
      color: var(--text-muted) !important;
      border: 1px solid rgba(255, 255, 255, 0.03) !important;
      pointer-events: none;
      box-shadow: none !important;
    }

    /* Animations */
    @keyframes fadeInDown {
      from {
        opacity: 0;
        transform: translateY(-20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeInUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Live Badge Indicator */
    .live-status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.82rem;
      font-weight: 500;
      color: #10b981;
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.2);
      padding: 4px 10px;
      border-radius: 6px;
      margin-left: 10px;
    }

    .live-status-offline {
      color: #f59e0b;
      background: rgba(245, 158, 11, 0.1);
      border: 1px solid rgba(245, 158, 11, 0.2);
    }

    .dot {
      width: 8px;
      height: 8px;
      background-color: currentColor;
      border-radius: 50%;
      display: inline-block;
    }

    .dot-pulse {
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.9); opacity: 1; }
      50% { transform: scale(1.3); opacity: 0.4; }
      100% { transform: scale(0.9); opacity: 1; }
    }

    /* Empty search results */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      background: var(--bg-card);
      border: 1px dashed var(--card-border);
      border-radius: 24px;
      grid-column: 1 / -1;
      display: none;
    }

    .empty-state svg {
      width: 48px;
      height: 48px;
      fill: var(--text-muted);
      margin-bottom: 16px;
    }

    .empty-state h3 {
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .empty-state p {
      color: var(--text-sub);
      font-size: 0.9rem;
    }

    /* Toast Notification */
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #1e1b4b;
      border: 1px solid var(--primary);
      color: #fff;
      padding: 14px 24px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(99, 102, 241, 0.2);
      font-size: 0.9rem;
      font-weight: 500;
      z-index: 100;
      transform: translateY(100px);
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .toast.show {
      transform: translateY(0);
      opacity: 1;
    }

    /* Responsive adjustments */
    @media (max-width: 768px) {
      .title { font-size: 2.2rem; }
      .controls-wrapper {
        flex-direction: column;
        align-items: stretch;
      }
      .search-box {
        max-width: 100%;
      }
      .filters-group {
        overflow-x: auto;
        padding-bottom: 5px;
      }
    }
  </style>
</head>
<body>

  <div class="glow-circle-1"></div>
  <div class="glow-circle-2"></div>

  <div class="app-container">
    <!-- Header -->
    <header class="header">
      <span class="badge">웹퍼블리싱 기초 과정</span>
      <h1 class="title">13주차 과제 현황판</h1>
      <p class="subtitle">
        구글 스프레드시트 데이터와 연동되어 실시간 과제 제출 여부를 모니터링합니다. 학생 카드를 클릭하여 깃허브 및 웹사이트 과제물을 확인할 수 있습니다.
        <span id="connectionStatus" class="live-status">
          <span class="dot dot-pulse"></span>
          실시간 연동 중
        </span>
      </p>
    </header>

    <!-- Stats Overview Dashboard -->
    <div class="stats-container" id="statsContainer">
      <div class="stat-card active" onclick="setFilter('all')">
        <div class="stat-value" id="statTotal">-</div>
        <div class="stat-label">전체 학생 수</div>
      </div>
      <div class="stat-card" onclick="setFilter('submitted')">
        <div class="stat-value" id="statSubmitted">-</div>
        <div class="stat-label">13주차 제출 완료</div>
      </div>
      <div class="stat-card" onclick="setFilter('not-submitted')">
        <div class="stat-value" id="statNotSubmitted">-</div>
        <div class="stat-label">미제출</div>
      </div>
      <div class="stat-card" style="cursor: default;">
        <div class="stat-value" id="statRate">-%</div>
        <div class="stat-label">과제 제출율</div>
      </div>
    </div>

    <!-- Controls Row -->
    <div class="controls-wrapper">
      <!-- Search Input -->
      <div class="search-box">
        <input type="text" class="search-input" id="searchInput" placeholder="학생 이름 또는 학번을 검색하세요..." oninput="handleSearch()">
        <svg viewBox="0 0 24 24">
          <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
        </svg>
      </div>

      <!-- Quick Filter Tabs & Sorting -->
      <div style="display: flex; gap: 15px; flex-wrap: wrap;">
        <div class="filters-group">
          <button class="filter-btn active" id="btnFilterAll" onclick="setFilter('all')">전체</button>
          <button class="filter-btn" id="btnFilterSubmitted" onclick="setFilter('submitted')">제출 완료</button>
          <button class="filter-btn" id="btnFilterNotSubmitted" onclick="setFilter('not-submitted')">미제출</button>
        </div>

        <select class="sort-select" id="sortSelect" onchange="handleSort()">
          <option value="id-asc">번호 순 (기본)</option>
          <option value="name-asc">이름 가나다순</option>
          <option value="rate-desc">종합 제출율 높은순</option>
          <option value="rate-asc">종합 제출율 낮은순</option>
        </select>
      </div>
    </div>

    <!-- Cards Grid -->
    <main class="grid-container" id="cardsGrid">
      <!-- Cards will be dynamically rendered here -->
      
      <!-- Empty state layout -->
      <div class="empty-state" id="emptyState">
        <svg viewBox="0 0 24 24">
          <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
        </svg>
        <h3>일치하는 학생을 찾지 못했습니다</h3>
        <p>검색어나 필터 조건을 다시 확인해 주세요.</p>
      </div>
    </main>
  </div>

  <!-- Toast Element -->
  <div class="toast" id="toast">복사 완료!</div>

  <script>
    const CSV_URL = 'https://docs.google.com/spreadsheets/d/1HOLsxOcaA9PFJLg6r6mpWSgEEPIITT2Pn9rQZF_O_yA/export?format=csv';

    // Parse CSV helper function
    function parseCSV(text) {
      const lines = text.split('\n');
      const parsedData = [];
      
      for (let line of lines) {
        line = line.trim();
        if (!line) continue;
        
        const firstChar = line.charAt(0);
        if (isNaN(firstChar) || firstChar === '') continue;
        
        // Parse columns (handling comma-separated values inside quotes properly)
        const columns = [];
        let insideQuote = false;
        let currentColumn = '';
        
        for (let i = 0; i < line.length; i++) {
          const char = line[i];
          if (char === '"') {
            insideQuote = !insideQuote;
          } else if (char === ',' && !insideQuote) {
            columns.push(currentColumn);
            currentColumn = '';
          } else {
            currentColumn += char;
          }
        }
        columns.push(currentColumn);
        
        if (columns.length < 8) continue;
        
        const id = parseInt(columns[0].trim());
        const dept = columns[1].trim();
        const studentId = columns[2].trim();
        const grade = columns[3].trim();
        const name = columns[4].trim();
        const email = columns[5].trim();
        const github = columns[6].trim();
        
        // Column indices representing weeks (1 to 15, excluding spacers)
        const weekIndices = [8, 9, 10, 11, 12, 13, 14, 15, 17, 18, 19, 20, 21, 22, 23];
        let submittedCount = 0;
        for (let idx of weekIndices) {
          if (columns[idx] && columns[idx].trim() !== '') {
            submittedCount++;
          }
        }
        
        // 13주차 is at index 21
        const week13Val = columns[21] ? columns[21].trim() : '';
        const hasSubmittedWeek13 = week13Val !== '';
        
        parsedData.push({
          id,
          dept,
          studentId,
          grade,
          name,
          email,
          github,
          week13Val,
          hasSubmittedWeek13,
          totalSubmissions: submittedCount,
          totalWeeks: weekIndices.length
        });
      }
      return parsedData;
    }

    // Helper to generate assignment url
    function getAssignmentUrl(githubUrl, folderName) {
      if (!githubUrl || !folderName) return '#';
      const cleanGithub = githubUrl.trim().replace(/\/+$/, '');
      const usernameMatch = cleanGithub.match(/github\.com\/([^\/]+)/);
      if (!usernameMatch) return '#';
      const username = usernameMatch[1];
      return `https://${username}.github.io/test-today/${encodeURIComponent(folderName.trim())}/`;
    }

    // Get Avatar Color based on name hash
    function getAvatarGradient(name) {
      const colors = [
        ['#4f46e5', '#7c3aed'], // Indigo-Purple
        ['#0891b2', '#0d9488'], // Cyan-Teal
        ['#db2777', '#e11d48'], // Pink-Rose
        ['#ea580c', '#d97706'], // Orange-Amber
        ['#2563eb', '#3b82f6'], // Blue
        ['#059669', '#16a34a']  // Green
      ];
      
      let hash = 0;
      for (let i = 0; i < name.length; i++) {
        hash = name.charCodeAt(i) + ((hash << 5) - hash);
      }
      const index = Math.abs(hash) % colors.length;
      const grad = colors[index];
      return `linear-gradient(135deg, ${grad[0]} 0%, ${grad[1]} 100%)`;
    }

            <a href="${assignmentUrl}" target="_blank" rel="noopener noreferrer" 
               class="btn-action btn-primary ${student.hasSubmittedWeek13 ? '' : 'disabled'}"
               title="${student.hasSubmittedWeek13 ? '과제 페이지 열기' : '제출하지 않았습니다'}">
              <svg viewBox="0 0 24 24">
                <path d="M19 19H5V5h7V3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2v-7h-2v7zM14 3v2h3.59l-9.83 9.83 1.41 1.41L19 6.41V10h2V3h-7z"/>
              </svg>
              과제 보기
            </a>
            
            <a href="${hasGithub ? student.github : '#'}" target="_blank" rel="noopener noreferrer" 
               class="btn-action ${hasGithub ? '' : 'disabled'}"
               title="${hasGithub ? '깃허브 프로필 이동' : '깃허브 정보 없음'}">
              <svg viewBox="0 0 24 24">
                <path d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/>

            <a href="mailto:${student.email}" class="btn-action" title="이메일 보내기">
              <svg viewBox="0 0 24 24">
                <path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/>

        `;
        
        cardsGrid.appendChild(card);
      });
    }

    // Update Statistics summary
    function updateStats() {
      const total = students.length;
      const submitted = students.filter(s => s.hasSubmittedWeek13).length;
      const notSubmitted = total - submitted;
      const rate = total > 0 ? Math.round((submitted / total) * 100) : 0;
      
      statTotal.innerText = total;
      statSubmitted.innerText = submitted;
      statNotSubmitted.innerText = notSubmitted;
      statRate.innerText = `${rate}%`;
    }

    // Set filter category (tabs)
    function setFilter(filterName) {
      currentFilter = filterName;
      
      // Update active tabs styles
      Object.keys(filterButtons).forEach(key => {
        if (key === filterName) {
          filterButtons[key].classList.add('active');
        } else {
          filterButtons[key].classList.remove('active');
        }
      });
      
      // Update active stats cards styles
      const statCards = document.querySelectorAll('.stats-container .stat-card');
      statCards.forEach((sc, index) => {
        if ((filterName === 'all' && index === 0) || 
            (filterName === 'submitted' && index === 1) || 
            (filterName === 'not-submitted' && index === 2)) {
          sc.classList.add('active');
        } else {
          sc.classList.remove('active');
        }
      });

      renderCards();
    }

    // Live search input handling
    function handleSearch() {
      searchQuery = searchInput.value.trim();
      renderCards();
    }

    // Sort sorting dropdown selection
    function handleSort() {
      currentSort = sortSelect.value;
      renderCards();
    }

    // Show custom toast notification
    function showToast(message) {
      const toast = document.getElementById('toast');
      toast.innerText = message;
      toast.classList.add('show');
      setTimeout(() => {
        toast.classList.remove('show');
      }, 2000);
    }

    // Load Data (Try live fetch first, then fallback)
    async function loadData() {
      const connStatus = document.getElementById('connectionStatus');
      
      try {
        const response = await fetch(CSV_URL);
        if (!response.ok) throw new Error('Network error');
        
        const csvText = await response.text();
        students = parseCSV(csvText);
        
        connStatus.innerHTML = '<span class="dot dot-pulse"></span> 실시간 연동 중';
        connStatus.className = 'live-status';
        
      } catch (err) {
        console.warn('Failed to fetch live spreadsheet data. Using local cache fallback.', err);
        
        // Use local static backup data
        students = parseCSV(fallbackCSV);
        
        connStatus.innerHTML = '<span class="dot"></span> 로컬 데이터 로드됨';
        connStatus.className = 'live-status live-status-offline';
      }
      
      updateStats();
      renderCards();
    }

    // Init
    window.addEventListener('DOMContentLoaded', loadData);
  </script>
</body>
</html>
